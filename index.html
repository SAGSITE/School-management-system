<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X'TRA 'O' CHOICE ACADEMY | School Management</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="toast" class="toast" aria-live="polite"></div>

    <main id="loginScreen" class="auth-shell">
      <section class="auth-brand" aria-label="School identity">
        <div class="crest" aria-hidden="true">
          <span class="crest-ring"></span>
          <span class="crest-text">XOC</span>
        </div>
        <p class="eyebrow">School Management Suite</p>
        <h1>X'TRA 'O' CHOICE ACADEMY</h1>
        <div class="brand-strip" aria-label="Class range">
          <span>Nursery</span>
          <span>Kindergarten</span>
          <span>Lower Primary</span>
          <span>Upper Primary</span>
          <span>JHS</span>
        </div>
      </section>

      <section class="login-panel">
        <form id="loginForm" class="login-card">
          <div>
            <p class="eyebrow">Secure access</p>
            <h2>Sign in</h2>
          </div>

          <div id="roleTabs" class="role-grid" aria-label="Choose portal">
            <button type="button" class="role-tab is-active" data-role="admin">Admin</button>
            <button type="button" class="role-tab" data-role="teacher">Teacher</button>
            <button type="button" class="role-tab" data-role="student">Student</button>
            <button type="button" class="role-tab" data-role="parent">Parent</button>
          </div>

          <label class="field">
            <span>Username</span>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </label>

          <label class="field">
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>

          <button class="primary-button" type="submit">
            <span class="button-icon" aria-hidden="true">-></span>
            Sign in
          </button>

          <div class="demo-box">
            <span>Demo access</span>
            <div class="demo-grid">
              <button type="button" data-demo="admin">admin / admin123</button>
              <button type="button" data-demo="teacher">teacher / teacher123</button>
              <button type="button" data-demo="student">student / student123</button>
              <button type="button" data-demo="parent">parent / parent123</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <div id="appShell" class="app-shell" hidden>
      <aside class="sidebar">
        <div class="brand-mini">
          <div class="brand-mark" aria-hidden="true">XOC</div>
          <div>
            <strong>X'TRA 'O'</strong>
            <span>CHOICE ACADEMY</span>
          </div>
        </div>
        <nav id="portalNav" class="portal-nav" aria-label="Portal navigation"></nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p id="portalLabel" class="eyebrow">Portal</p>
            <h2 id="pageTitle">Dashboard</h2>
          </div>
          <div class="top-actions">
            <button id="returnAdmin" class="ghost-button" type="button" hidden>Return to admin</button>
            <span id="userBadge" class="user-badge"></span>
            <button id="logoutButton" class="icon-button" type="button" aria-label="Logout" title="Logout">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M21 19V5a2 2 0 0 0-2-2h-6"></path>
              </svg>
            </button>
          </div>
        </header>

        <div id="content" class="content"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
